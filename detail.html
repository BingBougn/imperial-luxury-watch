<title>Fiche montre — Imperial</title>
<style>

    --graphite-3:#1e2226;

    --cobalt-bright:#4f9fd6;

    --bg-raised: var(--graphite-2);
    --hairline: #2a2f33;
    --text: #eaedee;
    --text-dim: #9aa3a8;
    --accent: var(--cobalt-bright);

  *{box-sizing:border-box;}
  body{

  .nav-inner{ display:flex; align-items:center; justify-content:space-between; height:76px; }
  .wordmark{

  .btn{

    cursor:pointer; text-decoration:none; display:inline-block;

  @media(max-width:1120px){ .nav-links{ gap:22px; font-size:0.76rem; } .wordmark small{ display:none; } .nav .btn{ padding:10px 14px; white-space:nowrap; } }

  :focus-visible{ outline:2px solid var(--accent-strong); outline-offset:3px; }

  /* ---------- breadcrumb ---------- */
  .crumb{ padding-top:28px; font-size:0.78rem; color:var(--text-dim); }
  .crumb a{ text-decoration:none; color:var(--text-dim); }
  .crumb a:hover{ color:var(--accent-strong); }

  }

  .media-main img{ width:100%; height:100%; object-fit:cover; }

  .thumbs button{

  .info .price{ font-family:'IBM Plex Mono'; font-size:1.7rem; margin:26px 0 36px; }

  .watch360{ position:absolute; inset:0; touch-action:pan-y; cursor:grab; user-select:none; }

  .watch360 img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; pointer-events:none; }

  .watch360-bar{

  .watch360-bar i{ display:block; height:100%; width:0; background:var(--accent-strong); transition:width .2s ease; }

  function buildWatch360(frames){
    const root = document.createElement('div');
    root.className = 'watch360';
    const bar = document.createElement('div');
    bar.className = 'watch360-bar';
    const barFill = document.createElement('i');
    bar.appendChild(barFill);
    root.appendChild(bar);
    const hint = document.createElement('p');
    hint.className = 'watch360-hint';
    hint.textContent = 'Glisser pour tourner';
    root.appendChild(hint);

    const total = frames.count;
    const imgs = [];
    let loaded = 0, current = 0, autoplay = true, touched = false, dragging = false, startX = 0, startFrame = 0;

    for(let i = 1; i <= total; i++){
      const im = new Image();
      im.alt = ''; im.draggable = false;
      im.src = frames.path + frames.prefix + String(i).padStart(3, '0') + frames.ext;
      im.addEventListener('load', function(){
        loaded++;
        barFill.style.width = (loaded / total * 100) + '%';
        if(loaded === total) root.classList.add('ready');
      });
      imgs.push(im); root.appendChild(im);
    }
    imgs[0].classList.add('on');

    function show(idx){
      idx = ((idx % total) + total) % total;
      if(idx === current) return;
      imgs[current].classList.remove('on');
      imgs[idx].classList.add('on');
      current = idx;
    }

    const spin = setInterval(function(){ if(autoplay && root.isConnected) show(current + 1); }, 70);

    function pointerDown(x){
      dragging = true; startX = x; startFrame = current; autoplay = false;
      root.classList.add('dragging');
      if(!touched){ touched = true; root.classList.add('touched'); }
    }
    function pointerMove(x){
      if(!dragging) return;
      const step = root.clientWidth / total * 0.7;
      show(startFrame + Math.round((x - startX) / step));
    }
    function pointerUp(){ dragging = false; root.classList.remove('dragging'); }

    root.addEventListener('mousedown', function(e){ e.preventDefault(); pointerDown(e.clientX); });
    window.addEventListener('mousemove', function(e){ pointerMove(e.clientX); });
    window.addEventListener('mouseup', pointerUp);
    root.addEventListener('touchstart', function(e){ pointerDown(e.touches[0].clientX); }, { passive: true });
    root.addEventListener('touchmove', function(e){ if(dragging){ e.preventDefault(); pointerMove(e.touches[0].clientX); } }, { passive: false });
    root.addEventListener('touchend', pointerUp);

    return root;
  }

      mainBox.appendChild(makeMedia(data.media));
      thumbMain.classList.add('is-active');
    }

    const infoCol = document.createElement('div');
    infoCol.className = 'info';
    infoCol.innerHTML =
      '<p class="eyebrow">' + data.brand + '</p>' +
      '<h1>' + data.model + '</h1>' +
      '<p class="spec-line">' + data.caseLine + '</p>' +
      '<p class="spec-line">Référence ' + data.ref + '</p>' +
      '<p class="price">' + data.price + '</p>';

    const actions = document.createElement('div');
    actions.className = 'contact-actions';
    actions.innerHTML =
      '<a href="tel:+33142860000"><span class="ico">☎</span> Appeler la boutique</a>' +
      '<a href="https://claude.ai/artifact/CUuvhUYedpLE1fbzZUFL72"><span class="ico">✉</span> Envoyer un message</a>';
    infoCol.appendChild(actions);

    const trust = document.createElement('div');
    trust.className = 'trust-grid';
    trust.innerHTML =
      '<div class="trust-card"><div class="trust-ico">✓</div><h4>Garantie Imperial</h4><p>24 mois pièces et main-d’œuvre sur l’ensemble de notre sélection, sans condition.</p></div>' +
      '<div class="trust-card"><div class="trust-ico">⚙</div><h4>Contrôle en 12 points</h4><p>Mouvement, boîtier et numéros de série vérifiés par nos horlogers avant remise.</p></div>' +
      '<div class="trust-card"><div class="trust-ico">◆</div><h4>Écrin de remise</h4><p>Livrée dans un écrin Imperial avec certificat d’authenticité et carnet d’entretien.</p></div>';
    infoCol.appendChild(trust);

    const desc = document.createElement('p');
    desc.className = 'desc';
    desc.textContent = data.desc;
    infoCol.appendChild(desc);

    const specLabel = document.createElement('p');
    specLabel.className = 'section-label';
    specLabel.textContent = 'État de la pièce';
    infoCol.appendChild(specLabel);

    const specTable = document.createElement('div');
    specTable.className = 'spec-table';
    data.specs.forEach(function(row){
      const line = document.createElement('div');
      line.innerHTML = '<span>' + row[0] + '</span><b>' + row[1] + '</b>';
      specTable.appendChild(line);
    });
    infoCol.appendChild(specTable);

    if(data.techSpecs){
      const techLabel = document.createElement('p');
      techLabel.className = 'section-label';
      techLabel.style.marginTop = '28px';
      techLabel.textContent = 'Fiche technique';
      infoCol.appendChild(techLabel);

      const techTable = document.createElement('div');
      techTable.className = 'tech-table';
      data.techSpecs.forEach(function(row){
        const line = document.createElement('div');
        line.innerHTML = '<span>' + row[0] + '</span><b>' + row[1] + '</b>';
        techTable.appendChild(line);
      });
      infoCol.appendChild(techTable);
    }

    const cta = document.createElement('a');
    cta.href = 'https://claude.ai/artifact/CUuvhUYedpLE1fbzZUFL72';
    cta.className = 'btn btn-accent';
    cta.style.marginTop = '8px';
    cta.style.textAlign = 'center';
    cta.textContent = 'Demander une fiche détaillée';
    infoCol.appendChild(cta);

    detail.appendChild(mediaCol);
    detail.appendChild(infoCol);
    root.appendChild(detail);

    if(data.features){
      const features = document.createElement('section');
      features.className = 'features';
      const head = document.createElement('h2');
      head.style.fontSize = '1.8rem';
      head.style.fontStyle = 'italic';
      head.textContent = 'Ce qui caractérise cette montre.';
      features.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'features-grid';
      data.features.forEach(function(f){
        const block = document.createElement('div');
        block.className = 'feature-block';
        const h3 = document.createElement('h3');
        h3.textContent = f[0];
        const p = document.createElement('p');
        p.textContent = f[1];
        block.appendChild(h3);
        block.appendChild(p);
        grid.appendChild(block);
      });
      features.appendChild(grid);
      root.appendChild(features);
    }

    const otherSlugs = Object.keys(WATCHES).filter(function(s){ return s !== slug; });
    const pick = otherSlugs.sort(function(){ return Math.random() - 0.5; }).slice(0, 3);
    if(pick.length){
      const related = document.createElement('section');
      related.className = 'related';
      const rHead = document.createElement('h2');
      rHead.style.fontStyle = 'italic';
      rHead.textContent = 'Vous pourriez aussi aimer.';
      related.appendChild(rHead);

      const rGrid = document.createElement('div');
      rGrid.className = 'related-grid';
      pick.forEach(function(s){
        const w = WATCHES[s];
        const card = document.createElement('a');
        card.className = 'related-card';
        card.href = '#' + s;
        const photo = document.createElement('div');
        photo.className = 'related-photo';
        photo.appendChild(makeMedia(w.media, 200));
        const body = document.createElement('div');
        body.className = 'related-body';
        body.innerHTML =
          '<p class="related-eyebrow">' + w.brand + '</p>' +
          '<h3>' + w.model + '</h3>' +
          '<p class="related-price">' + w.price + '</p>';
        card.appendChild(photo);
        card.appendChild(body);
        rGrid.appendChild(card);
      });
      related.appendChild(rGrid);
      root.appendChild(related);
    }
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
